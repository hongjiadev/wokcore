name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Self-test public repository hygiene checker
        shell: pwsh
        run: pwsh tests/scripts/check-public-repo-hygiene.tests.ps1
      - name: Check public repository hygiene
        shell: pwsh
        run: pwsh tests/scripts/check-public-repo-hygiene.ps1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: 1.97.1
          command: check
          arguments: --all-features

  native-platform-test:
    name: native-test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
      - name: Self-test fixed Windows test host
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/scripts/run-fixed-test-host.tests.ps1
      - name: Test native workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-features --locked --target ${{ matrix.target }}
      - name: Test native Windows workspace through fixed host
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File tests/scripts/run-fixed-test-host.ps1
          -RepositoryRoot "${{ github.workspace }}"
          -TargetDirectory "${{ github.workspace }}\target"
          -Target "${{ matrix.target }}"

  target-check:
    name: target-check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
      - name: Install Linux ARM64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Check target
        run: cargo check --workspace --all-features --locked --target ${{ matrix.target }}

  required-targets:
    if: always()
    needs:
      - quality
      - native-platform-test
      - target-check
    runs-on: ubuntu-24.04
    steps:
      - name: Require quality, native tests, and every target
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native-platform-test.result }}
          TARGET_RESULT: ${{ needs.target-check.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$NATIVE_RESULT" = "success"
          test "$TARGET_RESULT" = "success"
