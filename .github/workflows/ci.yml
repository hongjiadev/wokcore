name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      performance_profile:
        description: Portable performance profile
        required: true
        default: pull-request
        type: choice
        options:
          - pull-request
          - soak

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Self-test public repository hygiene checker
        shell: pwsh
        run: pwsh tests/scripts/check-public-repo-hygiene.tests.ps1
      - name: Check public repository hygiene
        shell: pwsh
        run: pwsh tests/scripts/check-public-repo-hygiene.ps1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features --locked
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: 1.97.1
          command: check
          arguments: --all-features

  native-platform-test:
    name: native-test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
      - name: Self-test fixed Windows test host
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/scripts/run-fixed-test-host.tests.ps1
      - name: Verify macOS diagnostic startup
        if: runner.os == 'macOS'
        run: >-
          cargo test
          --package wokcore-platform
          --lib
          --all-features
          --locked
          --target ${{ matrix.target }}
          diagnostics::tests::macos_diagnostic_directory_opens_and_publishes_on_private_system_temp_path
          -- --exact --nocapture
      - name: Verify concurrent macOS publishing
        if: runner.os == 'macOS'
        run: >-
          cargo test
          --package wokcore-platform
          --lib
          --all-features
          --locked
          --target ${{ matrix.target }}
          sessions::export_destination::apple_regression_tests::concurrent_relative_publishes_do_not_share_legacy_move_state
          -- --exact --nocapture
      - name: Test native workspace
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features --locked --target ${{ matrix.target }}
      - name: Test native macOS workspace with isolated process-global assertions
        if: runner.os == 'macOS'
        run: >-
          cargo test
          --workspace
          --all-features
          --locked
          --target ${{ matrix.target }}
          -- --test-threads=1
      - name: Test native Windows workspace through fixed host
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File tests/scripts/run-fixed-test-host.ps1
          -RepositoryRoot "${{ github.workspace }}"
          -TargetDirectory "${{ github.workspace }}\target"
          -Target "${{ matrix.target }}"

  target-check:
    name: target-check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
      - name: Check target
        run: cargo check --workspace --all-features --locked --target ${{ matrix.target }}
      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $source = [IO.File]::ReadAllText(
              (Join-Path $env:GITHUB_WORKSPACE "Cargo.toml"),
              [Text.Encoding]::UTF8
          )
          $match = [regex]::Match(
              $source,
              '(?ms)^\[workspace\.package\]\s*.*?^version\s*=\s*"([^"]+)"'
          )
          if (-not $match.Success) {
              throw "Workspace package version is missing."
          }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - name: Build fixed WokCore release executable
        run: >-
          cargo build
          --package wokcore
          --bin wokcore
          --release
          --locked
          --target ${{ matrix.target }}
      - name: Verify and package Windows executable
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $executable = Join-Path `
              "${{ github.workspace }}\target\${{ matrix.target }}\release" `
              "wokcore.exe"
          & $executable --version
          if ($LASTEXITCODE -ne 0) {
              throw "The fixed WokCore release executable did not start."
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File tests/release/build-package.ps1 `
              -ExecutablePath $executable `
              -RepositoryRoot "${{ github.workspace }}" `
              -OutputDirectory "${{ runner.temp }}\wokcore-release" `
              -Version "${{ steps.version.outputs.version }}" `
              -Target "${{ matrix.target }}"
      - name: Verify and package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          executable="${{ github.workspace }}/target/${{ matrix.target }}/release/wokcore"
          "$executable" --version
          bash tests/release/build-package.sh \
            --executable "$executable" \
            --repository-root "${{ github.workspace }}" \
            --output-directory "${{ runner.temp }}/wokcore-release" \
            --version "${{ steps.version.outputs.version }}" \
            --target "${{ matrix.target }}"
      - name: Upload deterministic CI package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-wokcore-package-${{ matrix.target }}
          path: ${{ runner.temp }}/wokcore-release/wokcore-v${{ steps.version.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release-contract:
    needs: target-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
      - name: Test deterministic release packages
        run: bash tests/release/build-package.tests.sh
      - name: Test release manifest and Windows package contracts
        shell: pwsh
        run: pwsh tests/release/verify-manifest.tests.ps1
      - name: Test workflow and public repository contracts
        shell: pwsh
        run: |
          pwsh tests/release/release-workflow.tests.ps1
          pwsh tests/scripts/check-public-repo-hygiene.tests.ps1
          pwsh tests/scripts/check-public-repo-hygiene.ps1
      - name: Download all five native CI packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ci-wokcore-package-*
          path: ${{ runner.temp }}/wokcore-release
          merge-multiple: true
      - name: Verify a signed five-target manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          dist="${{ runner.temp }}/wokcore-release"
          secret_key="${{ runner.temp }}/ci-wokcore-minisign.key"
          public_key="${{ runner.temp }}/ci-wokcore-minisign.pub"
          manifest="$dist/wokcore-update-v1.json"
          signature="$manifest.minisig"
          checksums="$dist/SHA256SUMS"
          trap 'rm -f -- "$secret_key" "$public_key"' EXIT
          version="$(
            sed -nE \
              '/^\[workspace\.package\]$/,/^\[/s/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              Cargo.toml
          )"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          umask 077
          minisign -G -W -f -p "$public_key" -s "$secret_key"
          key_id="$(
            pwsh tests/release/normalize-minisign-public-key.ps1 \
              -Path "$public_key"
          )"
          [[ "$key_id" =~ ^[0-9A-F]{16}$ ]]
          pwsh tests/release/write-manifest.ps1 \
            -ArtifactDirectory "$dist" \
            -Version "$version" \
            -SigningKeyId "$key_id" \
            -OutputPath "$manifest" \
            -ChecksumsPath "$checksums"
          minisign -S -W \
            -s "$secret_key" \
            -m "$manifest" \
            -x "$signature" \
            -c "WokCore CI release manifest" \
            -t "ephemeral CI signature"
          pwsh tests/release/verify-manifest.ps1 \
            -ManifestPath "$manifest" \
            -SignaturePath "$signature" \
            -PublicKeyPath "$public_key" \
            -ArtifactDirectory "$dist" \
            -ChecksumsPath "$checksums" \
            -ExpectedVersion "$version" \
            -ExpectedSigningKeyId "$key_id" \
            -MinisignPath "$(command -v minisign)"
          rm -f -- "$secret_key" "$public_key"
          trap - EXIT

  performance-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check portable gate shell syntax
        run: bash -n tests/performance/run-provider-gates.sh
      - name: Test portable gate shell logic
        run: bash tests/performance/run-provider-gates.tests.sh
      - name: Test exact Provider gate logic
        shell: pwsh
        run: pwsh tests/performance/run-provider-gates.tests.ps1
      - name: Test portable Provider gate policy
        shell: pwsh
        run: pwsh tests/performance/portable-provider-gates.tests.ps1

  windows-performance:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""
      AZURE_OPENAI_ENDPOINT: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test Windows resource gate logic
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File tests/performance/windows-resource-gate.tests.ps1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          target: x86_64-pc-windows-msvc
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Run exact Windows release gates
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File tests/performance/run-provider-gates.ps1
          -Profile release
          -OutputDirectory "${{ runner.temp }}\wokcore-performance\windows"
          -TargetDirectory "${{ github.workspace }}\target"
      - name: Upload bounded Windows performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-gates-windows-x64
          path: ${{ runner.temp }}\wokcore-performance\windows\provider-gates-report.json
          if-no-files-found: warn
          retention-days: 7

  portable-performance:
    name: portable-performance (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PERFORMANCE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_profile || 'pull-request' }}
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""
      AZURE_OPENAI_ENDPOINT: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
      - name: Install private Linux Secret Service runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Build fixed release executables offline
        run: >-
          cargo build
          --workspace
          --all-features
          --release
          --locked
          --offline
          --target-dir "${{ github.workspace }}/target"
      - name: Run Linux portable Provider gate
        if: runner.os == 'Linux'
        run: >-
          dbus-run-session --
          env WOKCORE_PRIVATE_DBUS=1
          bash tests/performance/run-provider-gates.sh
          --profile "$PERFORMANCE_PROFILE"
          --output-directory "${{ runner.temp }}/wokcore-performance/${{ matrix.target }}"
          --target-directory "${{ github.workspace }}/target"
          --skip-build
      - name: Run macOS portable Provider gate
        if: runner.os == 'macOS'
        run: >-
          bash tests/performance/run-provider-gates.sh
          --profile "$PERFORMANCE_PROFILE"
          --output-directory "${{ runner.temp }}/wokcore-performance/${{ matrix.target }}"
          --target-directory "${{ github.workspace }}/target"
          --skip-build
      - name: Upload bounded portable performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-gates-${{ matrix.target }}
          path: ${{ runner.temp }}/wokcore-performance/${{ matrix.target }}/provider-gates-${{ matrix.platform }}-${{ env.PERFORMANCE_PROFILE }}.json
          if-no-files-found: warn
          retention-days: 7

  required-targets:
    if: always()
    needs:
      - quality
      - native-platform-test
      - target-check
      - release-contract
      - performance-policy
      - windows-performance
      - portable-performance
    runs-on: ubuntu-24.04
    steps:
      - name: Require quality, native tests, every target, and performance gates
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native-platform-test.result }}
          TARGET_RESULT: ${{ needs.target-check.result }}
          RELEASE_CONTRACT_RESULT: ${{ needs.release-contract.result }}
          PERFORMANCE_POLICY_RESULT: ${{ needs.performance-policy.result }}
          WINDOWS_PERFORMANCE_RESULT: ${{ needs.windows-performance.result }}
          PORTABLE_PERFORMANCE_RESULT: ${{ needs.portable-performance.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$NATIVE_RESULT" = "success"
          test "$TARGET_RESULT" = "success"
          test "$RELEASE_CONTRACT_RESULT" = "success"
          test "$PERFORMANCE_POLICY_RESULT" = "success"
          test "$WINDOWS_PERFORMANCE_RESULT" = "success"
          test "$PORTABLE_PERFORMANCE_RESULT" = "success"
