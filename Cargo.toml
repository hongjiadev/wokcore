[workspace]
resolver = "2"
members = [
  "apps/wokcore",
  "crates/wokcore-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
repository = "https://github.com/hongjiadev/wokcore"

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
