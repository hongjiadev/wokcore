[workspace]
resolver = "2"
members = [
  "apps/wokcore",
  "crates/wokcore-core",
  "crates/wokcore-protocols",
  "crates/wokcore-storage",
  "crates/wokcore-platform",
  "crates/wokcore-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"
repository = "https://github.com/hongjiadev/wokcore"

[workspace.dependencies]
async-trait = "0.1.91"
arc-swap = "1.7"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
fs4 = "0.13"
getrandom = "0.4.3"
keyring = "4.1.5"
libc = "0.2.189"
prost = "0.14"
rusqlite = { version = "0.40.1", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = { version = "0.25", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }
zeroize = "1.9.0"
